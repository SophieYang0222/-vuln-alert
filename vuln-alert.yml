.github/workflows/name: vuln-alert

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC); GitHub may delay scheduled runs a few minutes
  workflow_dispatch: {}

permissions:
  contents: write            # commit state/seen.json and docs/data.json back to the repo
  pages: write               # publish the dashboard
  id-token: write

concurrency:
  group: vuln-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check sources, update dashboard data, send LINE alerts
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}   # leave unset to disable LINE
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_MIN_PRIORITY: ${{ vars.LINE_MIN_PRIORITY || '3' }}             # 1 = only 🔴 exploited
          WATCHLIST: ${{ secrets.WATCHLIST }}                                 # your real keywords, kept hidden
          PUBLISH_WATCHLIST: ${{ vars.PUBLISH_WATCHLIST || 'false' }}         # 'true' only for a private dashboard
          NICS_RSS_URL: ${{ vars.NICS_RSS_URL }}
          SOURCES: ${{ vars.SOURCES || 'nics,nics_news,tvn,kev' }}
        run: python vuln_alert.py

      - name: Save state and history
        if: always()
        run: |
          git config user.name  "vuln-alert-bot"
          git config user.email "vuln-alert-bot@users.noreply.github.com"
          git add state/seen.json docs/data.json 2>/dev/null || true
                    git diff --cached --quiet || (git commit -m "update alert state [skip ci]" && (git push || (git pull --rebase && git push)))

      - name: Prepare dashboard
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish dashboard
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
